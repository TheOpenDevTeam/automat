[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "automat"
version = "2.0b1"
description = "Task Automation Manager — open-source инструмент для автоматизации с расширенным функционалом"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.9"
dependencies = [
    "PyQt5>=5.15.9",
    "PyQtChart>=5.15.6",
    "requests>=2.31.0",
    "apscheduler>=3.10.4",
    "psutil>=5.9.8",
    "openpyxl>=3.1.2",
    "python-docx>=1.1.2",
    "reportlab>=4.1.0",
    "pdf2docx>=0.5.6",
    "pdfplumber>=0.11.0",
    "Pillow>=10.2.0",
    "paramiko>=3.4.0",
    "qrcode>=7.4.2",
    "PyYAML>=6.0",
    # Windows-only: DOCX -> PDF via Word COM. convert_pro degrades
    # gracefully when it is missing (shows an install hint instead).
    "docx2pdf>=0.1.1; sys_platform == 'win32'",
]

[project.urls]
Source = "https://github.com/TheOpenDevTeam/automat"
Documentation = "https://github.com/TheOpenDevTeam/automat#readme"
Tracker = "https://github.com/TheOpenDevTeam/automat/issues"

[project.scripts]
automat = "automat.main:main"

[tool.setuptools.packages.find]
include = ["automat*", "automat.core*", "automat.ui*", "automat.ui.pages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
