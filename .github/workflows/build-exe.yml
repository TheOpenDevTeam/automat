name: Build EXE

# Builds AUTOMAT.exe on every push to main and on demand.
# The zip is stored as a workflow artifact (no GitHub release is created).
# Download it from the Actions tab -> Build EXE -> Artifacts.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + pyinstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller pytest

      - name: Smoke test (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/ -q

      # Built from the repo root so the `automat` package resolves.
      # --paths . guarantees modulegraph finds it; no --add-data needed
      # because icons and QSS live in Python modules.
      - name: Build AUTOMAT.exe
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name "AUTOMAT" --paths . automat/main.py

      - name: Pack artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist/AUTOMAT/* -DestinationPath "AUTOMAT-windows.zip"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AUTOMAT-windows
          path: AUTOMAT-windows.zip
