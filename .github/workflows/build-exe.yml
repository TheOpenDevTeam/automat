name: Build EXE

# Builds the Windows installer on every push to main and on demand.
# AUTOMAT-Setup-*.exe is stored as a workflow artifact (no GitHub
# release is created). Download it from Actions -> Build EXE -> Artifacts.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + pyinstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller pytest

      - name: Smoke test (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/ -q

      # Built from the repo root so the `automat` package resolves.
      # --paths . guarantees modulegraph finds it; no --add-data needed
      # because icons and QSS live in Python modules.
      - name: Build AUTOMAT.exe
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name "AUTOMAT" --paths . automat/main.py

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\automat.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AUTOMAT-Setup
          path: installer/Output/AUTOMAT-Setup-*.exe
